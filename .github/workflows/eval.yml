name: Eval gate

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Golden-trace eval gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run golden-trace eval gate
        # surefire skipped — unit tests are the CI workflow's job; this gate only runs the eval IT
        run: mvn -B -ntp -pl tracegraph-e2e -am verify -Dit.test=EvalCiGateIT -Dsurefire.skip=true

      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-reports
          path: tracegraph-e2e/target/failsafe-reports/*
          if-no-files-found: ignore
