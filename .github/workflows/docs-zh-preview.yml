name: Build and deploy Chinese docs preview

on:
  push:
    branches: [ 'i18n/zh-autotranslate' ]
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-zh-preview.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install mkdocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build site
        run: |
          # -d is resolved relative to the mkdocs.yml directory, so use an absolute path
          mkdocs build -f docs/site/mkdocs.yml -d "$GITHUB_WORKSPACE/site"

      # PR runs stop here — building is the check. Deploying from PRs would let any PR
      # overwrite the published gh-pages-zh branch.
      - name: Deploy to gh-pages-zh
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use `GH_PAGES_PAT` if provided (recommended when org policies restrict GITHUB_TOKEN),
          # otherwise fall back to the auto-generated `GITHUB_TOKEN`.
          github_token: ${{ secrets.GH_PAGES_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages-zh
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
