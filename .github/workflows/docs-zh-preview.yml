name: Build and deploy Chinese docs preview

on:
  push:
    branches: [ 'i18n/zh-autotranslate' ]
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install mkdocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build site
        run: |
          # build the docs site; mkdocs config is at docs/site/mkdocs.yml
          mkdocs build -f docs/site/mkdocs.yml -d site

      - name: Prepare deploy token
        run: |
          echo "Using GH_PAGES_PAT if set, otherwise GITHUB_TOKEN"
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}

      - name: Deploy to gh-pages-zh
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use `GH_PAGES_PAT` if provided (recommended when org policies restrict GITHUB_TOKEN),
          # otherwise fall back to the auto-generated `GITHUB_TOKEN`.
          github_token: ${{ secrets.GH_PAGES_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages-zh
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

