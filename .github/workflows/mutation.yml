name: Mutation tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pitest:
    name: PIT mutation coverage (tracegraph-core)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install parent and dependencies
        run: mvn -B -ntp install -DskipTests

      - name: Run PIT mutation tests
        run: mvn -B -ntp -Pmutation -pl tracegraph-core test

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: tracegraph-core/target/pit-reports/
          if-no-files-found: ignore
