# -----------------------------------------------------------------------
# TraceGraph — production tuning reference
# Copy relevant entries into your application.properties / application.yml
# -----------------------------------------------------------------------

# Virtual threads (JDK 21 + Spring Boot 3.2+): lets Tomcat handle thousands
# of concurrent SSE connections without a large carrier-thread pool.
spring.threads.virtual.enabled=true

# Tomcat connector — carrier threads stay small; virtual threads do the work.
server.tomcat.threads.max=200
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20s

# Async / SSE request timeout (0 = no timeout, rely on SSE keep-alive instead).
spring.mvc.async.request-timeout=-1

# Graceful shutdown — drain in-flight requests before the JVM exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# HikariCP — pool ≈ cores × 2 + spindles. Adjust to your DB host.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# TraceGraph CORS — replace with your actual frontend origin(s).
tracegraph.web.cors.allowed-origins=https://www.tracegraph.site

# TraceGraph rate limiting (off by default — enable in production).
tracegraph.web.rate-limit.enabled=true
tracegraph.web.rate-limit.rps=50
tracegraph.web.rate-limit.burst=100

# Replay concurrency cap — prevents a burst of replays from starving other ops.
tracegraph.web.replay.max-concurrent=10

# GC — ZGC for low-latency (add to JVM args: -XX:+UseZGC -Xmx<heap>)
# Heap sizing: 512m–2g depending on trace volume. Profile with -Xlog:gc*.
