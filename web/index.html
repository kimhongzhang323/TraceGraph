<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceGraph · Typed agent runtime for the JVM</title>
    <meta name="description" content="TraceGraph is a typed execution-graph runtime for the JVM. Replay runs, resume checkpoints, and observe every step." />
    <meta name="robots" content="index,follow" />

    <!--
      CSP: no unsafe-inline on scripts (anti-scrape moved to /src/antiscrape.js).
      connect-src includes the optional external API origin via the env var;
      vercel.json sets the header-level CSP which takes precedence in production.
    -->
    <!--
      Security headers that work as meta tags (subset only).
      frame-ancestors, X-Frame-Options, and HSTS must be HTTP headers —
      those are set in vercel.json (production) and vite.config.ts (dev).
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' data: blob:;
                   connect-src 'self' https:;
                   base-uri 'self';
                   form-action 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="canonical" href="https://www.tracegraph.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TraceGraph" />
    <meta property="og:title" content="TraceGraph · Typed agent runtime for the JVM" />
    <meta property="og:description" content="TraceGraph is a typed execution-graph runtime for the JVM. Replay runs, resume checkpoints, and observe every step." />
    <meta property="og:url" content="https://www.tracegraph.site/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/antiscrape.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
