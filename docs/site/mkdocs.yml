site_name: TraceGraph
site_description: Production-grade JVM agent runtime — typed graphs, durable memory, deep observability
site_url: https://site.tracegraph.io
repo_url: https://github.com/kimho/TraceGraph
repo_name: TraceGraph
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - 中文:
    - 主页: zh/index.md
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Your First Graph: getting-started/first-graph.md
    - Quickstart: getting-started/quickstart.md
    - Spring Boot Setup: getting-started/spring-boot.md
  - Tutorial:
    - "01 — Nodes & Edges": tutorial/01-nodes-and-edges.md
    - "02 — State & Context": tutorial/02-state-and-context.md
    - "03 — Retries & Failures": tutorial/03-retries-and-failures.md
    - "04 — Checkpoints & Resume": tutorial/04-checkpoints-and-resume.md
    - "05 — Parallel & Send": tutorial/05-parallel-and-send.md
    - "06 — Memory": tutorial/06-memory.md
    - "07 — LLM & Tools": tutorial/07-llm-and-tools.md
    - "08 — ReAct Agent": tutorial/08-react-agent.md
    - "09 — RAG Pipeline": tutorial/09-rag-pipeline.md
    - "10 — Replay & Diff": tutorial/10-replay-and-diff.md
    - "11 — HITL Interrupts": tutorial/11-hitl-interrupts.md
  - Concepts:
    - Graph & Nodes: concepts/graph-nodes.md
    - State & Context: concepts/state-context.md
    - Edges & Routing: concepts/edges-routing.md
    - Observability: concepts/observability.md
    - Memory: concepts/memory.md
    - Connectors: concepts/connectors.md
    - RAG: concepts/rag.md
  - Reference:
    - REST API: reference/rest-api.md
    - Configuration: reference/configuration.md
    - Graph Complexity: reference/complexity.md
  - Trace UI:
    - Overview: trace-ui/overview.md
    - Views Guide: trace-ui/views.md
  - Spring Boot: spring-boot.md
  - Cookbook:
    - ReAct Agent: cookbook/react-agent.md
    - RAG Agent: cookbook/rag-agent.md
    - HITL Approval: cookbook/hitl-approval.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

plugins:
  - search
extra:
  site_author: "TraceGraph contributors"
  copyright: "© 2026 TraceGraph contributors · Apache-2.0"
  site_version: "v0.3.0 · jdk-21+"
